name: Build debug APK

on:
  push:
    branches: [fix/sqlcipher-load, redesign/ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast gate: compiles every Kotlin module and runs the JVM unit tests (no native build).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin and run unit tests
        shell: bash
        run: ./gradlew compileDebugKotlin testDebugUnitTest --continue --console=plain --stacktrace 2>&1 | tee gradle-check.log

      - name: Publish check log to ci-logs branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "job=check status=$JOB_STATUS run=${{ github.run_number }} sha=${{ github.sha }}"
            echo "---- errors and failures ----"
            grep -E "^e: |^w: .*(deprecat|unused)|error:|FAILED|What went wrong|Execution failed|Unresolved|BUILD " -A4 gradle-check.log | head -300 || true
            echo "---- last 60 lines ----"
            tail -60 gradle-check.log
          } > ci-check.txt
          bash scripts/publish-ci-log.sh ci-check.txt latest-check.txt

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch llama.cpp sources
        run: ./scripts/vendor-llama.sh

      # A prebuilt libhydra_llama.so is committed for arm64. Remove it so the freshly compiled
      # library is the only one packaged (two copies would fail the merge).
      - name: Remove committed prebuilt native library
        run: rm -rf core/llama/src/main/jniLibs

      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace 2>&1 | tee gradle-apk.log

      - name: Publish APK log to ci-logs branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "job=apk status=$JOB_STATUS run=${{ github.run_number }} sha=${{ github.sha }}"
            echo "---- errors and failures ----"
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed|BUILD " -A4 gradle-apk.log | head -200 || true
            echo "---- last 40 lines ----"
            tail -40 gradle-apk.log
          } > ci-apk.txt
          bash scripts/publish-ci-log.sh ci-apk.txt latest-apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk hydra-debug.apk
          gh release create "$TAG" hydra-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Debug build ${{ github.run_number }}" \
            --notes "Debug APK from commit ${{ github.sha }}. Installs as com.zenlink.hydra.debug."
