name: Build debug APK

on:
  push:
    branches: [fix/sqlcipher-load]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch llama.cpp sources
        run: ./scripts/vendor-llama.sh

      # A prebuilt libhydra_llama.so is committed for arm64. Remove it so the freshly compiled
      # library is the only one packaged (two copies would fail the merge).
      - name: Remove committed prebuilt native library
        run: rm -rf core/llama/src/main/jniLibs

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk hydra-debug.apk
          gh release create "$TAG" hydra-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Debug build ${{ github.run_number }}" \
            --notes "Debug APK from commit ${{ github.sha }}. Installs as com.zenlink.hydra.debug."
