name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (no NDK required)
        run: |
          ./gradlew :core:model:testDebugUnitTest \
                    :core:billing:testDebugUnitTest \
                    :core:sharing:testDebugUnitTest \
                    :core:download:testDebugUnitTest \
                    :core:device:testDebugUnitTest \
                    :core:monitoring:testDebugUnitTest \
                    :core:database:testDebugUnitTest \
                    :feature:chat:testDebugUnitTest \
                    :feature:onboarding:testDebugUnitTest \
                    :feature:models:testDebugUnitTest \
                    :feature:settings:testDebugUnitTest \
                    :app:testDebugUnitTest \
                    --stacktrace

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
