name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Required docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release-readiness files
        run: |
          set -e
          for f in README.md LICENSE LICENSING.md SECURITY.md CONTRIBUTING.md ARCHITECTURE.md CHANGELOG.md RELEASE.md NOTES.md keystore.properties.example; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "All required docs present."

  static-analysis:
    name: Detekt
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run detekt
        # Alpha: ignoreFailures=true until a committed baseline is generated on a full Android SDK agent.
        run: ./gradlew detekt --stacktrace

  android-unit:
    name: Android unit tests + coverage
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          ./gradlew :core:model:testDebugUnitTest \
                    :core:billing:testDebugUnitTest \
                    :core:sharing:testDebugUnitTest \
                    :core:download:testDebugUnitTest \
                    :core:device:testDebugUnitTest \
                    :core:monitoring:testDebugUnitTest \
                    :core:database:testDebugUnitTest \
                    :feature:chat:testDebugUnitTest \
                    :feature:onboarding:testDebugUnitTest \
                    :feature:models:testDebugUnitTest \
                    :feature:settings:testDebugUnitTest \
                    :app:testDebugUnitTest \
                    --stacktrace


  web:
    name: Web typecheck + unit tests
    runs-on: ubuntu-latest
    needs: docs
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
