build:
  # Alpha: informative analysis without blocking merges on legacy style.
  maxIssues: 500
  excludeCorrectable: false
  weights:
    complexity: 1
    LongParameterList: 1
    style: 0
    comments: 0

config:
  validation: true

comments:
  active: false

complexity:
  active: true
  LongMethod:
    threshold: 120
  LongParameterList:
    constructorThreshold: 16
    functionThreshold: 12
  ComplexCondition:
    threshold: 6
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    threshold: 6
  CyclomaticComplexMethod:
    threshold: 20

empty-blocks:
  active: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test', 'Preview']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  VariableNaming:
    active: false
  ConstructorParameterNaming:
    active: false

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    max: 8
  ThrowsCount:
    max: 8
  UseCheckOrError:
    active: false
  ForbiddenComment:
    active: false
  NewLineAtEndOfFile:
    active: false
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true

performance:
  active: false
