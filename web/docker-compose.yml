# Web-only compose (run from web/): docker compose up -d
# Uses an on-disk SQLite/libsql file — no Turso cloud account.

services:
  web:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_data:/app/data
    ports:
      - "3000:3000"
    environment:
      TURSO_DATABASE_URL: file:/app/data/local.db
      AUTH_SECRET: local-dev-auth-secret-at-least-32-chars-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      USE_MOCK_PLAY: "true"
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      R2_PUBLIC_BASE_URL: https://models.example.com
    command: >
      bash -c "mkdir -p /app/data && npm ci && npm run db:migrate && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  node_modules:
  web_data:
